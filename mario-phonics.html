<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARIO KART PHONICS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bangers&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Bangers', cursive;
            background: linear-gradient(to bottom, #87CEEB 0%, #b3e5fc 100%);
            overflow: hidden;
            user-select: none;
        }
        .game-view {
            position: absolute;
            inset: 0;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .view-visible {
            display: flex !important;
            opacity: 1 !important;
        }
        .mario-button {
            background: linear-gradient(to bottom, #ff6b6b, #c92a2a);
            border: 4px solid #fff;
            border-radius: 16px;
            box-shadow: 0 6px 0 #8b1a1a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .mario-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8b1a1a;
        }
        .track {
            width: 600px;
            height: 400px;
            background: #4ade80;
            border: 8px solid #2d7a3a;
            border-radius: 200px;
            position: relative;
            margin: 20px auto;
        }
        .track-lane {
            position: absolute;
            width: 560px;
            height: 360px;
            border: 4px dashed #fff;
            border-radius: 180px;
            left: 16px;
            top: 16px;
        }
        .kart {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #mario-kart { background: #e60012; }
        #luigi-kart { background: #00a500; }
        #peach-kart { background: #ff69b4; }
        #bowser-kart { background: #ff8c00; }
        .finish-line {
            position: absolute;
            width: 80px;
            height: 20px;
            background: repeating-linear-gradient(45deg, #000, #000 10px, #fff 10px, #fff 20px);
            left: 260px;
            top: 10px;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin { animation: spin 0.5s linear; }
    </style>
</head>
<body>

<!-- START SCREEN -->
<div id="view-start" class="game-view view-visible flex-col items-center justify-center">
    <h1 class="text-6xl text-red-600 mb-8" style="font-family: 'Press Start 2P';">MARIO KART</h1>
    <h2 class="text-4xl text-yellow-400 mb-12" style="font-family: 'Bangers';">PHONICS RACING</h2>
    <button onclick="startGame()" class="mario-button px-12 py-6 text-3xl">START RACING!</button>
</div>

<!-- RACING VIEW -->
<div id="view-race" class="game-view flex-col items-center">
    <!-- HUD -->
    <div class="w-full bg-black/80 text-white px-6 py-3 flex justify-between text-2xl">
        <span id="track-name">🏁 Mario Circuit</span>
        <span>🪙 <span id="coin-count">0</span></span>
        <span>Question <span id="question-num">1</span>/<span id="total-questions">5</span></span>
        <span id="position">Position: 1st</span>
    </div>

    <!-- Question Panel -->
    <div class="bg-yellow-400 border-4 border-black rounded-lg p-4 m-4 text-center" style="min-width: 600px;">
        <div id="question-text" class="text-3xl mb-4">Loading...</div>
        <div id="options-container" class="grid grid-cols-2 gap-3"></div>
    </div>

    <!-- Racing Track -->
    <div class="track">
        <div class="finish-line"></div>
        <div class="track-lane"></div>
        <div id="mario-kart" class="kart">🏎️</div>
        <div id="luigi-kart" class="kart">🏎️</div>
        <div id="peach-kart" class="kart">🏎️</div>
        <div id="bowser-kart" class="kart">🏎️</div>
    </div>
</div>

<!-- RESULTS VIEW -->
<div id="view-results" class="game-view flex-col items-center justify-center">
    <h1 class="text-6xl mb-8">🏁 RACE COMPLETE!</h1>
    <div class="text-5xl mb-4" id="final-position">1ST PLACE! 🥇</div>
    <div class="text-3xl mb-8">Coins Earned: <span id="coins-earned">0</span> 🪙</div>
    <button onclick="startGame()" class="mario-button px-12 py-6 text-3xl">RACE AGAIN!</button>
</div>

<script>
// PHONICS DATA
const PHONICS_DATA = {
    phase3: [
        { sound: 'ai', words: [{ t: 'rain', e: '🌧️' }, { t: 'wait', e: '⏳' }, { t: 'train', e: '🚂' }, { t: 'pain', e: '🤕' }, { t: 'sail', e: '⛵' }] },
        { sound: 'ee', words: [{ t: 'see', e: '👀' }, { t: 'feet', e: '🦶' }, { t: 'tree', e: '🌳' }, { t: 'deep', e: '🌊' }, { t: 'green', e: '💚' }] },
        { sound: 'oa', words: [{ t: 'boat', e: '🚤' }, { t: 'coat', e: '🧥' }, { t: 'road', e: '🛣️' }, { t: 'soap', e: '🧼' }, { t: 'goat', e: '🐐' }] },
        { sound: 'ar', words: [{ t: 'car', e: '🚗' }, { t: 'park', e: '🏞️' }, { t: 'star', e: '⭐' }, { t: 'dark', e: '🌑' }, { t: 'farm', e: '🚜' }] }
    ]
};

// GAME STATE
let state = {
    coins: 0,
    currentQuestion: 0,
    totalQuestions: 5,
    playerProgress: 0,
    cpuProgress: [0, 0, 0]
};

// SOUNDS
const playSound = (freq, dur = 0.1) => {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur);
};

function startGame() {
    state = { coins: 0, currentQuestion: 0, totalQuestions: 5, playerProgress: 0, cpuProgress: [0, 0, 0] };
    switchView('view-race');
    resetKarts();
    generateQuestion();
    updateHUD();
}

function switchView(viewId) {
    document.querySelectorAll('.game-view').forEach(v => v.classList.remove('view-visible'));
    document.getElementById(viewId).classList.add('view-visible');
}

function resetKarts() {
    document.getElementById('mario-kart').style.left = '20px';
    document.getElementById('mario-kart').style.top = '180px';
    document.getElementById('luigi-kart').style.left = '20px';
    document.getElementById('luigi-kart').style.top = '200px';
    document.getElementById('peach-kart').style.left = '20px';
    document.getElementById('peach-kart').style.top = '220px';
    document.getElementById('bowser-kart').style.left = '20px';
    document.getElementById('bowser-kart').style.top = '240px';
}

function generateQuestion() {
    if (state.currentQuestion >= state.totalQuestions) {
        finishRace();
        return;
    }

    const data = PHONICS_DATA.phase3;
    const item = data[Math.floor(Math.random() * data.length)];
    const sound = item.sound;
    const wordObj = item.words[Math.floor(Math.random() * item.words.length)];
    const word = wordObj.t;
    const emoji = wordObj.e;

    const correct = sound;
    const options = [correct];
    const allSounds = ['ai', 'ee', 'oa', 'ar', 'or', 'ow', 'oi'];
    while (options.length < 4) {
        const opt = allSounds[Math.floor(Math.random() * allSounds.length)];
        if (!options.includes(opt)) options.push(opt);
    }
    shuffle(options);

    document.getElementById('question-text').innerHTML = `What sound is in the word <strong>"${word}"</strong> ${emoji}?`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.className = 'mario-button px-6 py-4 text-2xl';
        btn.onclick = () => checkAnswer(opt, correct);
        container.appendChild(btn);
    });

    state.currentQuestion++;
    updateHUD();
}

function checkAnswer(selected, correct) {
    if (selected === correct) {
        // CORRECT!
        playSound(800, 0.1);
        playSound(1000, 0.1);
        state.coins += 10;
        state.playerProgress += (100 / state.totalQuestions);
        moveKartForward('mario-kart', state.playerProgress);
        setTimeout(generateQuestion, 800);
    } else {
        // WRONG!
        playSound(200, 0.3);
        document.getElementById('mario-kart').classList.add('spin');
        setTimeout(() => document.getElementById('mario-kart').classList.remove('spin'), 500);
        setTimeout(generateQuestion, 1000);
    }

    // Move CPU karts
    state.cpuProgress = state.cpuProgress.map(p => p + Math.random() * 15 + 5);
    moveKartForward('luigi-kart', state.cpuProgress[0]);
    moveKartForward('peach-kart', state.cpuProgress[1]);
    moveKartForward('bowser-kart', state.cpuProgress[2]);

    updateHUD();
}

function moveKartForward(kartId, progress) {
    const kart = document.getElementById(kartId);
    const angle = (progress / 100) * 360;
    const radius = 150;
    const centerX = 300;
    const centerY = 200;

    const x = centerX + radius * Math.cos((angle - 90) * Math.PI / 180);
    const y = centerY + radius * Math.sin((angle - 90) * Math.PI / 180);

    kart.style.left = x + 'px';
    kart.style.top = y + 'px';
}

function updateHUD() {
    document.getElementById('coin-count').textContent = state.coins;
    document.getElementById('question-num').textContent = state.currentQuestion;
    document.getElementById('total-questions').textContent = state.totalQuestions;

    const positions = [
        { name: 'Mario', progress: state.playerProgress },
        { name: 'Luigi', progress: state.cpuProgress[0] },
        { name: 'Peach', progress: state.cpuProgress[1] },
        { name: 'Bowser', progress: state.cpuProgress[2] }
    ].sort((a, b) => b.progress - a.progress);

    const playerPos = positions.findIndex(p => p.name === 'Mario') + 1;
    const suffix = playerPos === 1 ? 'st' : playerPos === 2 ? 'nd' : playerPos === 3 ? 'rd' : 'th';
    document.getElementById('position').textContent = `Position: ${playerPos}${suffix}`;
}

function finishRace() {
    const positions = [
        { name: 'Mario', progress: state.playerProgress },
        { name: 'Luigi', progress: state.cpuProgress[0] },
        { name: 'Peach', progress: state.cpuProgress[1] },
        { name: 'Bowser', progress: state.cpuProgress[2] }
    ].sort((a, b) => b.progress - a.progress);

    const playerPos = positions.findIndex(p => p.name === 'Mario') + 1;
    const medals = ['🥇 1ST PLACE!', '🥈 2ND PLACE', '🥉 3RD PLACE', '4TH PLACE'];

    document.getElementById('final-position').textContent = medals[playerPos - 1] || '4TH PLACE';
    document.getElementById('coins-earned').textContent = state.coins;

    if (playerPos <= 3) {
        playSound(500, 0.2);
        setTimeout(() => playSound(600, 0.2), 200);
        setTimeout(() => playSound(700, 0.3), 400);
    } else {
        playSound(300, 0.5);
    }

    switchView('view-results');
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}
</script>

</body>
</html>
